spring:
  application:
    name: account-service
  datasource:
    url: ${CBP_DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${CBP_DB_USER:banking}
    password: ${CBP_DB_PASSWORD:banking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: account
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: account
    default-schema: account
    create-schemas: true

server:
  port: ${CBP_SERVER_PORT:8081}

ledger:
  base-url: ${CBP_LEDGER_BASE_URL:http://localhost:8083}
  # Ledger provisioning on account open: "off" (default) or "http" (creates a GL account).
  provisioning: ${CBP_LEDGER_PROVISIONING:off}
  # Debit posting to ledger-service: "off" (default) or "grpc" (ADR-007).
  posting: ${CBP_LEDGER_POSTING:off}
  settlement-account: ${CBP_LEDGER_SETTLEMENT_ACCOUNT:SETTLEMENT}
  grpc:
    target: ${CBP_LEDGER_GRPC_TARGET:localhost:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},correlationId=%X{correlationId:-n/a}]"

# Service-to-service authentication (ADR-008).
#  enabled         — this service mints tokens for its outbound calls
#  require-inbound — this service refuses inbound calls that carry no acceptable token
# No secret is committed: SERVICE_AUTH_SECRET (>= 32 bytes) comes from the environment. See .env.example.
service-auth:
  enabled: ${CBP_SERVICE_AUTH_ENABLED:false}
  require-inbound: ${CBP_SERVICE_AUTH_REQUIRE_INBOUND:false}
  service-name: account-service
  secret: ${CBP_SERVICE_AUTH_SECRET:}
  issuer: ${CBP_SERVICE_AUTH_ISSUER:core-banking-platform}
  token-ttl-seconds: ${CBP_SERVICE_AUTH_TOKEN_TTL:60}
  clock-skew-seconds: ${CBP_SERVICE_AUTH_CLOCK_SKEW:30}
