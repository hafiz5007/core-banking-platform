name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles, runs unit + integration tests (Testcontainers needs Docker, available on the runner).
      - name: Build and verify
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/*-reports/*.xml'
          if-no-files-found: ignore

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Enforces formatting (Spotless) and a JaCoCo coverage floor.
      - name: Quality gate (format + coverage)
        run: mvn -B verify -Pquality

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore

  security-scan:
    runs-on: ubuntu-latest
    steps:
      # Gitleaks scans a commit range (`<first pushed commit>^..<head>`), so the parent of the
      # oldest pushed commit has to be in the clone. The default shallow fetch-depth of 1 leaves it
      # out, `git log` aborts with "unknown revision", and gitleaks exits non-zero without ever
      # scanning anything. Full history is what makes the scan real rather than vacuous.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependency vulnerability review on PRs (fails on high/critical CVEs in new dependencies).
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # Secret scanning.
      # The config in gitleaks.toml extends the default rule set and allowlists
      # synthetic HS256 test secrets under src/test/**. Real leaks in src/main/**
      # are still caught.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/gitleaks.toml
  # Every service image must build. This is not covered by `mvn verify`: the Dockerfiles copy the
  # reactor and run their own Maven build, so a module added to the parent pom without the
  # Dockerfiles keeping up breaks `docker compose build` while the Maven build stays green.
  # That is exactly how every image came to be unbuildable without anyone noticing.
  docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build every service image
        run: |
          set -e
          for svc in account-service admin-service api-gateway card-service customer-service \
                     interest-fee-service ledger-service notification-service payment-service \
                     reporting-service risk-aml-service; do
            echo "::group::$svc"
            docker build -f "$svc/Dockerfile" -t "cbp/$svc:ci" .
            echo "::endgroup::"
          done

  # Brings the platform up exactly as a sandbox would, with Kafka and service auth on, and proves
  # the topics are created and the services report healthy.
  compose-smoke:
    runs-on: ubuntu-latest
    needs: docker-images
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start infrastructure
        run: |
          cp .env.example .env
          {
            echo "CBP_KAFKA_ENABLED=true"
            echo "CBP_SERVICE_AUTH_ENABLED=true"
            echo "CBP_SERVICE_AUTH_SECRET=$(openssl rand -base64 48)"
          } >> .env
          docker compose up -d postgres kafka
          timeout 180 sh -c 'until [ "$(docker compose ps kafka --format "{{.Health}}")" = "healthy" ]; do sleep 5; done'

      - name: Create topics
        run: docker compose up kafka-init --exit-code-from kafka-init

      - name: Assert all four topics exist
        run: |
          set -e
          topics=$(docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
                     --bootstrap-server localhost:9092 --list)
          for t in payment.events account.events card.events customer.events; do
            echo "$topics" | grep -qx "$t" || { echo "missing topic: $t"; exit 1; }
          done
          echo "all four topics present"

      - name: Tear down
        if: always()
        run: docker compose down -v
