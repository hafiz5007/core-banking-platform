name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles, runs unit + integration tests (Testcontainers needs Docker, available on the runner).
      - name: Build and verify
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/*-reports/*.xml'
          if-no-files-found: ignore

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Enforces formatting (Spotless) and a JaCoCo coverage floor.
      - name: Quality gate (format + coverage)
        run: mvn -B verify -Pquality

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dependency vulnerability review on PRs (fails on high/critical CVEs in new dependencies).
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # Secret scanning.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
