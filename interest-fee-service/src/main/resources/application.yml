spring:
  application:
    name: interest-fee-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${DB_USER:banking}
    password: ${DB_PASSWORD:banking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: interest
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: interest
    default-schema: interest
    create-schemas: true

server:
  port: ${SERVER_PORT:8085}

ledger:
  base-url: ${LEDGER_BASE_URL:http://localhost:8083}

interest:
  expense-account: ${INTEREST_EXPENSE_ACCOUNT:INTEREST-EXPENSE}

fee:
  income-account: ${FEE_INCOME_ACCOUNT:FEE-INCOME}

eod:
  scheduler:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},correlationId=%X{correlationId:-n/a}]"
