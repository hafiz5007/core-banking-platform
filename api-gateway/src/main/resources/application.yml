spring:
  application:
    name: api-gateway
  # The IdP to validate bearer tokens against, used when gateway.security.enabled=true.
  # Set CBP_GATEWAY_JWT_ISSUER_URI in .env; left empty, the resource server is not configured.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CBP_GATEWAY_JWT_ISSUER_URI:}
  cloud:
    gateway:
      mvc:
        routes:
          - id: account-service
            uri: ${CBP_ACCOUNT_URI:http://localhost:8081}
            predicates:
              - Path=/api/v1/accounts/**,/api/v1/products/**
          - id: customer-service
            uri: ${CBP_CUSTOMER_URI:http://localhost:8082}
            predicates:
              - Path=/api/v1/customers/**,/api/v1/open-banking/**
          - id: ledger-service
            uri: ${CBP_LEDGER_URI:http://localhost:8083}
            predicates:
              - Path=/api/v1/ledger/**
          - id: payment-service
            uri: ${CBP_PAYMENT_URI:http://localhost:8084}
            predicates:
              - Path=/api/v1/payments/**,/api/v1/standing-orders/**,/api/v1/direct-debits/**,/api/v1/aliases/**,/api/v1/billers/**
          - id: interest-fee-service
            uri: ${CBP_INTEREST_URI:http://localhost:8085}
            predicates:
              - Path=/api/v1/interest/**
          - id: card-service
            uri: ${CBP_CARD_URI:http://localhost:8086}
            predicates:
              - Path=/api/v1/cards/**
          - id: notification-service
            uri: ${CBP_NOTIFICATION_URI:http://localhost:8087}
            predicates:
              - Path=/api/v1/notifications/**
          - id: risk-aml-service
            uri: ${CBP_RISK_URI:http://localhost:8088}
            predicates:
              - Path=/api/v1/risk/**
          - id: admin-service
            uri: ${CBP_ADMIN_URI:http://localhost:8089}
            predicates:
              - Path=/api/v1/admin/**
          - id: reporting-service
            uri: ${CBP_REPORTING_URI:http://localhost:8090}
            predicates:
              - Path=/api/v1/reports/**

server:
  port: ${CBP_SERVER_PORT:8080}

gateway:
  security:
    enabled: ${CBP_GATEWAY_SECURITY_ENABLED:false}
  rate-limit:
    per-minute: ${CBP_GATEWAY_RATE_LIMIT:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name}]"
