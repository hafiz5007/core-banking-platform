spring:
  application:
    name: ledger-service
  datasource:
    url: ${CBP_DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${CBP_DB_USER:banking}
    password: ${CBP_DB_PASSWORD:banking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ledger
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ledger
    default-schema: ledger
    create-schemas: true

server:
  port: ${CBP_SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},correlationId=%X{correlationId:-n/a}]"

# gRPC posting endpoint (ADR-007). Off by default so REST-only deployments are unchanged;
# docker-compose turns it on and publishes ${CBP_GRPC_PORT}.
grpc:
  server:
    enabled: ${CBP_GRPC_SERVER_ENABLED:false}
    port: ${CBP_GRPC_PORT:9090}

# Service-to-service authentication (ADR-008).
#  enabled         — this service mints tokens for its outbound calls
#  require-inbound — this service refuses inbound calls that carry no acceptable token
# No secret is committed: SERVICE_AUTH_SECRET (>= 32 bytes) comes from the environment. See .env.example.
service-auth:
  enabled: ${CBP_SERVICE_AUTH_ENABLED:false}
  require-inbound: ${CBP_SERVICE_AUTH_REQUIRE_INBOUND:true}
  service-name: ledger-service
  secret: ${CBP_SERVICE_AUTH_SECRET:}
  issuer: ${CBP_SERVICE_AUTH_ISSUER:core-banking-platform}
  token-ttl-seconds: ${CBP_SERVICE_AUTH_TOKEN_TTL:60}
  clock-skew-seconds: ${CBP_SERVICE_AUTH_CLOCK_SKEW:30}
