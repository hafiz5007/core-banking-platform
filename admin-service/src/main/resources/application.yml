spring:
  application:
    name: admin-service
  datasource:
    url: ${CBP_DB_URL:jdbc:postgresql://localhost:5432/banking}
    username: ${CBP_DB_USER:banking}
    password: ${CBP_DB_PASSWORD:banking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: admin
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: admin
    default-schema: admin
    create-schemas: true

server:
  port: ${CBP_SERVER_PORT:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},correlationId=%X{correlationId:-n/a}]"
